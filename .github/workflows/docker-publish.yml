name: Build and publish image

on:
  push:
    branches: [main, develop]
    tags: ["v*"]
  workflow_dispatch:

env:
  IMAGE_NAME: flashcards-backend
  # Key the FlashCards deploy workflow matches on. Not the same string as
  # IMAGE_NAME for the frontend, so it is spelled out separately everywhere.
  SERVICE: backend

concurrency:
  group: docker-publish-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Gates the push: no image is published from a red build.
  test:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Matches <java.version>17</java.version> in pom.xml and the JRE in the
      # runtime image.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Run tests
        run: mvn -B -ntp test
        env:
          SPRING_DOCKER_COMPOSE_ENABLED: "false"

  publish:
    name: Build and push to GHCR
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Only immutable tags are produced. `latest` is deliberately disabled -
      # the cluster pins exact tags (INFRASTRUCTURE.md rule 11).
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}
          flavor: latest=false
          tags: |
            type=sha,prefix=sha-,format=short
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          # The target node is linux/amd64; skipping other platforms avoids a
          # slow QEMU cross-build.
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Publish summary
        run: |
          {
            echo "### Published"
            echo
            echo '```'
            echo "${{ steps.meta.outputs.tags }}"
            echo "digest: ${{ steps.build.outputs.digest }}"
            echo '```'
            echo
            echo "The \`Trigger deployment\` job below rolls this out. To do it"
            echo "by hand from the FlashCards repository instead:"
            echo
            echo '```sh'
            echo "cd k8s/overlays/develop   # or overlays/production"
            echo "kustomize edit set image ${{ env.IMAGE_NAME }}=*:sha-$(git rev-parse --short HEAD)"
            echo '```'
            echo
            echo "then push, or run the \`Deploy\` workflow with the tag override."
          } >> "$GITHUB_STEP_SUMMARY"

  # ---------------------------------------------------------------------------
  #  Tells the FlashCards root repository that a new image exists so it can
  #  render the manifests and roll the matching cluster:
  #
  #    develop -> 57.128.251.9  (namespace moomento-dev)
  #    main    -> 57.129.66.163 (namespace moomento)
  #
  #  Needs a repository secret DEPLOY_DISPATCH_TOKEN - a fine-grained PAT scoped
  #  to Path-Of-Execution-Team/FlashCards with Contents: read and write, because
  #  the repository_dispatch endpoint is gated on Contents: write. GITHUB_TOKEN
  #  cannot be used: it is scoped to this repository only.
  #
  #  Kept as a separate job on purpose. If the token is missing or expired the
  #  failure shows up as its own red check while `publish` stays green, so it is
  #  obvious that the image was pushed and only the rollout trigger failed.
  # ---------------------------------------------------------------------------
  notify:
    name: Trigger deployment
    needs: publish
    # Tag builds are excluded: a semver release is rolled out deliberately via
    # the Deploy workflow's tag override, not automatically.
    if: github.ref_type == 'branch'
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch to FlashCards
        env:
          GH_TOKEN: ${{ secrets.DEPLOY_DISPATCH_TOKEN }}
          REF_NAME: ${{ github.ref_name }}
          SHA: ${{ github.sha }}
        run: |
          case "${REF_NAME}" in
            main)    environment=production ;;
            develop) environment=develop ;;
            *)
              echo "::notice::Branch ${REF_NAME} maps to no environment - nothing to deploy."
              exit 0
              ;;
          esac

          if [ -z "${GH_TOKEN}" ]; then
            echo "::error::DEPLOY_DISPATCH_TOKEN is not set. The image was published but no deployment was triggered."
            exit 1
          fi

          # Must match docker/metadata-action's type=sha,format=short output.
          tag="sha-$(printf '%s' "${SHA}" | cut -c1-7)"

          gh api --method POST \
            -H "Accept: application/vnd.github+json" \
            repos/Path-Of-Execution-Team/FlashCards/dispatches \
            --input - <<JSON
          {
            "event_type": "image-published",
            "client_payload": {
              "service": "${SERVICE}",
              "tag": "${tag}",
              "environment": "${environment}"
            }
          }
          JSON

          echo "Dispatched ${SERVICE}:${tag} -> ${environment}" >> "$GITHUB_STEP_SUMMARY"
